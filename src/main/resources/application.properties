server.port=${PORT:8080}
video.browser.enabled=${VIDEO_BROWSER_ENABLED:true}
video.browser.channel=${VIDEO_BROWSER_CHANNEL:}
spring.mvc.async.request-timeout=-1
spring.web.resources.cache.cachecontrol.no-store=true
google.drive.client-id=${GOOGLE_CLIENT_ID:}
google.drive.client-secret=${GOOGLE_CLIENT_SECRET:}
google.drive.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/drive/callback}
google.drive.max-upload-bytes=${GOOGLE_DRIVE_MAX_UPLOAD_BYTES:4294967296}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
