<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影片連結解析器</title><meta name="description" content="貼上公開影片網址，解析、預覽與下載影片。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314b8a6'/%3E%3Cpath d='M12 8L25 16L12 24Z' fill='%230b1220'/%3E%3C/svg%3E">
<style>
.diagnostics{margin-top:24px;padding:20px;background:#101b2c;border:1px solid #34465f;border-radius:12px}.diagnostics h3{font-size:16px;margin:0 0 12px}.diagnostics pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 ui-monospace,monospace;color:#c0d3e9;margin:0}
[hidden]{display:none!important}:root{color-scheme:dark;font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#ecf2f9;background:#0b1220;font-size:16px}*{box-sizing:border-box}body{margin:0}header{max-width:1160px;margin:auto;padding:30px 28px;display:flex;align-items:center;gap:12px;font-weight:650}.mark{background:#28d0b4;color:#08241f;width:34px;height:34px;border-radius:9px;display:grid;place-items:center}header span:last-child{margin-left:auto;color:#96a5bb;font-size:14px;font-weight:400}main{max-width:1040px;margin:32px auto 70px;padding:0 28px}.eyebrow{color:#32d8be;font-size:14px;letter-spacing:2px}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1px;margin:14px 0}p{line-height:1.7;color:#a7b5c9}.panel{margin-top:30px;background:#121e30;border:1px solid #28364b;border-radius:18px;padding:28px}label{display:block;font-size:14px;color:#c6d2e2;margin-bottom:12px}.input-row{display:flex;gap:12px}input{width:100%;min-width:0;background:#0a1322;border:1px solid #3d4d64;color:white;font:inherit;padding:16px;border-radius:10px}input:focus{outline:2px solid #36d3ba;outline-offset:2px}button,.button{border:0;border-radius:10px;background:#2cd0b3;color:#09231f;padding:15px 24px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}button:hover,.button:hover{background:#64e6cf}button:disabled{opacity:.6;cursor:wait}.hint{font-size:14px;margin:14px 0 0}.formats{display:flex;gap:10px;margin:20px 0;color:#95a9c2;font-size:14px}.formats span{border:1px solid #2a3d56;padding:6px 12px;border-radius:6px}#status{margin-top:18px;line-height:1.6}#status:empty{display:none}.error{color:#ffb5b5;background:#311c29;border:1px solid #643347;border-radius:10px;padding:14px}#results[hidden]{display:none}.result-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:38px 0 18px}h2{font-size:22px;margin:0;overflow-wrap:anywhere}.count{font-size:14px;color:#9cafc6;flex-shrink:0}.workspace{display:grid;grid-template-columns:1fr 300px;gap:18px}.player{background:#050a12;border:1px solid #26354b;border-radius:14px;overflow:hidden}video{width:100%;display:block;min-height:240px;max-height:430px}.player-note{padding:14px 18px;margin:0;font-size:14px}.episodes{background:#121e30;border:1px solid #28364b;border-radius:14px;padding:14px;max-height:400px;overflow:auto}.episode{width:100%;text-align:left;justify-content:flex-start;background:transparent;color:#b7c7dc;padding:14px;margin-bottom:5px;font-size:14px;white-space:normal}.episode:hover,.episode.active{background:#183c3c;color:#67efda}.detail{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:18px}.detail label{margin:0}select{background:#121e30;color:#e6eef9;border:1px solid #40516b;border-radius:8px;padding:12px;font:inherit}.secondary{background:#23334b;color:#d9e7f9}.secondary:hover{background:#324967}.empty{display:flex;gap:20px;align-items:center;margin-top:30px;padding:26px;border:1px dashed #34465f;border-radius:14px}.empty .symbol{font-size:30px;color:#6b819e}.empty h2{font-size:16px}.empty p{margin:6px 0 0;font-size:14px}.notes{margin-top:36px;border-top:1px solid #253248;padding-top:18px;font-size:14px}.notes p{margin:8px 0}#download-status{font-size:14px;color:#8de7d5;line-height:1.6}a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #6fefd8;outline-offset:3px}@media(max-width:750px){header{padding:22px 20px}header span:last-child{display:none}main{margin-top:20px;padding:0 20px}.panel{padding:20px}.input-row{flex-direction:column}.workspace{grid-template-columns:1fr}.episodes{max-height:200px}video{min-height:190px}.result-head{align-items:flex-start}.detail>*{flex-grow:1}.formats{flex-wrap:wrap}.empty{padding:20px}}
</style></head><body>
<header><span class="mark" aria-hidden="true">▶</span>影片連結解析器<span>公開影片 · 網址解析</span></header>
<main><div class="eyebrow">VIDEO EXTRACTOR</div><h1>貼上網址，取得影片。</h1><p>解析網頁中的第一個影片來源，並自動送出下載請求。</p>
<form id="form" class="panel"><label for="url">影片或網頁網址</label><div class="input-row"><input id="url" type="url" required placeholder="https://example.com/video" autocomplete="off" spellcheck="false"><button id="parse" type="submit">解析並下載</button></div><p class="hint">支援公開網頁、MP4 與 M3U8 連結。</p><div id="status" role="status" aria-live="polite"></div></form>
<div class="formats"><span>MP4 直接下載</span><span>HLS 分段合併</span><span>第一個影片來源</span></div>
<section class="empty" id="empty"><div class="symbol" aria-hidden="true">▷</div><div><h2>等待你的影片網址</h2><p>解析成功後，影片與可下載的來源會顯示在這裡。</p></div></section>
<section id="results" hidden><div class="result-head"><h2 id="title"></h2><span class="count" id="count"></span></div><div class="workspace"><div class="player"><video id="video" controls preload="none" playsinline></video><p class="player-note" id="player-note">選擇影片以開始預覽。</p></div><div class="episodes" id="episodes" aria-label="影片集數"></div></div><div class="detail"><label for="source">影片來源</label><select id="source"></select><button id="download" type="button">下載影片</button><a id="original" class="button secondary" target="_blank" rel="noopener noreferrer">開啟來源</a></div><p id="download-status" role="status"></p></section>
<footer class="notes"><p>僅下載你有權使用的影片。登入限制、DRM 或需執行 JavaScript 的播放器可能無法解析。</p><p>未加密的完整 HLS 會合併為 .ts 檔；直播、加密 HLS 與分段 MP4 尚不支援合併。來源網站也可能限制播放或下載。</p></footer></main>
<script>
const $=id=>document.getElementById(id);let data,index=0,busy=false;
const diagnosticSection=document.createElement('section');diagnosticSection.className='diagnostics';diagnosticSection.hidden=true;const diagnosticHeading=document.createElement('h3');diagnosticHeading.textContent='解析與來源回應';const diagnosticText=document.createElement('pre');diagnosticSection.append(diagnosticHeading,diagnosticText);$('results').after(diagnosticSection);
function showDiagnostics(details){diagnosticSection.hidden=false;diagnosticText.textContent='輸入網址：'+$('url').value+'\n解析後網頁：'+(data?.pageURL||'')+'\n找到的影片網址：'+(data?selected():'')+'\n';if(details?.attempts){for(const [i,a] of details.attempts.entries())diagnosticText.textContent+='\n嘗試 '+(i+1)+'\n實際回應網址：'+a.actualURL+'\nReferer：'+a.referer+'\nHTTP 狀態：'+(a.status??'未取得')+'\n回傳類型：'+(a.contentType||'未取得')+'\n錯誤：'+a.error+'\n回應內容開頭（最多 512 字元）：\n'+(a.preview||'未取得')+'\n'}}
function endpoint(path,url){return path+'?'+new URLSearchParams({url,referer:data.pageURL,name:data.title+' - '+data.episodes[index].name})}
function selected(){return data.episodes[index].urls[Number($('source').value)||0]}
function updateSource(){const url=selected(),hls=/\.m3u8$/i.test(new URL(url).pathname);$('video').pause();$('video').src=hls?url:endpoint('/api/media',url);$('original').href=url;$('player-note').textContent=hls?'HLS 預覽依瀏覽器支援；無法播放時，可下載合併檔。':'按播放鍵預覽影片。';$('download').textContent=hls?'合併下載 TS':'下載 MP4';$('download-status').textContent=''}
function choose(i){index=i;[...$('episodes').children].forEach((b,n)=>{b.classList.toggle('active',n===i);b.setAttribute('aria-pressed',String(n===i))});$('source').replaceChildren(...data.episodes[i].urls.map((url,n)=>{const o=document.createElement('option');o.value=n;o.textContent='來源 '+(n+1)+' · '+new URL(url).hostname;return o}));updateSource()}
async function parse(url){if(busy)throw Error('正在解析，請稍候。');busy=true;$('parse').disabled=true;$('parse').textContent='解析中…';$('status').className='';$('status').textContent='正在尋找影片來源…';$('results').hidden=true;$('empty').hidden=false;$('video').pause();$('video').removeAttribute('src');$('video').load();try{const r=await fetch('/api/inspect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const result=await r.json();if(!r.ok)throw Error(result.error);data=result;$('title').textContent=data.title;$('count').textContent=data.episodes.length+' 部影片';$('episodes').replaceChildren(...data.episodes.map((e,i)=>{const b=document.createElement('button');b.type='button';b.className='episode';b.textContent=String(i+1).padStart(2,'0')+'  '+e.name;b.onclick=()=>choose(i);return b}));choose(0);$('results').hidden=false;$('empty').hidden=true;$('status').textContent='解析完成，找到 '+data.episodes.length+' 部影片。';return {title:data.title,episodes:data.episodes}}catch(e){$('status').className='error';$('status').textContent=e.message;throw e}finally{busy=false;$('parse').disabled=false;$('parse').textContent='解析影片'}}
$('form').onsubmit=e=>{e.preventDefault();diagnosticSection.hidden=true;parse($('url').value.trim()).then(()=>{showDiagnostics();return downloadVideo()}).catch(()=>{})};$('source').onchange=()=>{updateSource();showDiagnostics()};$('video').onerror=()=>{$('player-note').textContent='此來源無法在瀏覽器預覽，可嘗試下載或開啟來源。'};
async function downloadVideo(){const url=selected();showDiagnostics();$('download').disabled=true;$('download-status').textContent='正在檢查下載來源…';try{const r=await fetch(endpoint('/api/download',url));if(!r.ok){const e=await r.json();showDiagnostics(e.details);throw Error(e.error)}await r.body.cancel();const a=document.createElement('a');a.href=endpoint('/api/download',url);a.download='';document.body.append(a);a.click();a.remove();$('download-status').textContent='已向瀏覽器送出下載請求。請在瀏覽器下載清單查看進度；若沒有開始下載，請再按一次下載按鈕。'}catch(e){$('download-status').textContent=e.message}finally{$('download').disabled=false}}
$('download').onclick=downloadVideo;
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'parse_video_url',description:'解析公開影片網址並在頁面顯示可播放與下載的來源。',inputSchema:{type:'object',properties:{url:{type:'string'}},required:['url'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},async execute(input){if(typeof input?.url!=='string')throw Error('需要網址');const u=new URL(input.url);if(!['https:','http:'].includes(u.protocol))throw Error('僅接受 HTTP/HTTPS');$('url').value=input.url;return parse(input.url)}})).catch(()=>{})}catch{}}
</script></body></html>
