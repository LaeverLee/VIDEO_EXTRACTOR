services:
  app:
    build: .
    restart: unless-stopped
    mem_limit: 2g
    shm_size: 256m
    pids_limit: 256
    expose:
      - "8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: https://${SITE_DOMAIN:?Set SITE_DOMAIN}/api/drive/callback
      GOOGLE_DRIVE_MAX_UPLOAD_BYTES: ${GOOGLE_DRIVE_MAX_UPLOAD_BYTES:-4294967296}
    volumes:
      - video_temp:/tmp
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  video_temp:
  caddy_data:
  caddy_config:
